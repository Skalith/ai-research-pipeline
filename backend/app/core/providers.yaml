
providers:
  - name: openai
    enabled: true
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    models:
      - name: gpt-4o-mini
        type: chat
        priority: 1
        rate_limit_rpm: 60
      - name: text-embedding-3-small
        type: embedding
        priority: 1
    priority: 1

  - name: anthropic
    enabled: true
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    models:
      - name: claude-3-haiku-20240307
        type: chat
        priority: 2
    priority: 2

  - name: gemini
    enabled: true
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
    models:
      - name: gemini-1.5-flash
        type: chat
        priority: 3
    priority: 3

  - name: groq
    enabled: true
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models:
      - name: llama3-8b-8192
        type: chat
        priority: 4
    priority: 4

  - name: nvidia-nim
    enabled: false
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    models:
      - name: meta/llama3-70b-instruct
        type: chat
        priority: 5
    priority: 5

  - name: ollama
    enabled: false
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    models:
      - name: llama3
        type: chat
        priority: 10
    priority: 10

  - name: openrouter
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      - name: meta-llama/llama-3.1-8b-instruct:free
        type: chat
        priority: 6
      - name: mistralai/mistral-7b-instruct:free
        type: chat
        priority: 6
    priority: 6

  - name: omniroute
    enabled: false
    base_url: ${OMNIROUTE_BASE_URL:-https://api.omniroute.example/v1}
    api_key_env: OMNIROUTE_API_KEY
    models:
      - name: omniroute-default
        type: chat
        priority: 7
    priority: 7
    openai_compatible: true

  - name: cerebras
    enabled: true
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    models:
      - name: llama3.1-8b
        type: chat
        priority: 8
    priority: 8

  - name: mistral
    enabled: true
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    models:
      - name: mistral-small-latest
        type: chat
        priority: 9
    priority: 9

# Per-agent model mapping
agent_models:
  scraper: gpt-4o-mini
  summarizer: gpt-4o-mini
  fact_checker: gpt-4o-mini
  writer: gpt-4o-mini
  editor: gpt-4o-mini
  embedding: text-embedding-3-small
