[tool.poetry]
name = "multi-agent-pipeline"
version = "0.2.0"
description = "AI-assisted research pipeline backend"
authors = ["Skalith <149223175+Skalith@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {version = "^0.110.0", extras = ["standard"]}
uvicorn = {version = "^0.29.0", extras = ["standard"]}
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pgvector = "^0.3.5"
psycopg2-binary = "^2.9.9"
pydantic = "^2.6.0"
email-validator = "^2.0.0"
pydantic-settings = "^2.1.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
celery = {version = "^5.3.6", extras = ["redis"]}
redis = "^5.0.3"
httpx = "^0.27.0"
playwright = "^1.42.0"
trafilatura = "^1.6.4"
beautifulsoup4 = "^4.12.3"
lxml = "^5.1.0"
pymupdf = "^1.23.26"
arxiv = "^2.1.0"
crewai = "^0.28.8"
langchain = "^0.1.8"
langchain-openai = "^0.1.3"
litellm = "^1.27.0"
langfuse = "^2.28.0"
jinja2 = "^3.1.3"
weasyprint = "^60.2"
python-docx = "^1.1.2"
structlog = "^24.1.0"
tenacity = "^8.2.3"
python-multipart = "^0.0.9"
sse-starlette = "^2.1.0"
urllib3 = "^2.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-mock = "^3.12.0"
httpx = "^0.27.0"
faker = "^22.0.0"
coverage = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
