services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: research_pipeline
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_user -d research_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-local_dev_redis}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_dev_redis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://research_user:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/research_pipeline
      REDIS_URL: redis://:${REDIS_PASSWORD:-local_dev_redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local_dev_redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local_dev_redis}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-32-chars-min-for-jwt}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTO_START_WORKER: "0"
      REPORT_OUTPUT_DIR: /app/reports
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    volumes:
      - reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal
      - external

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q research --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://research_user:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/research_pipeline
      REDIS_URL: redis://:${REDIS_PASSWORD:-local_dev_redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local_dev_redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local_dev_redis}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-32-chars-min-for-jwt}
      REPORT_OUTPUT_DIR: /app/reports
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    volumes:
      - reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - external

volumes:
  pgdata:
  reports:

networks:
  internal:
    internal: true
  external:
