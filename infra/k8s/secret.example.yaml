
# Copy to secret.yaml and fill real values, never commit secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: research-pipeline-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://research_user:REPLACE_WITH_STRONG_PASSWORD@postgres.example:5432/research_pipeline"
  REDIS_URL: "redis://:REPLACE_WITH_STRONG_PASSWORD@redis.example:6379/0"
  CELERY_BROKER_URL: "redis://:REPLACE_WITH_STRONG_PASSWORD@redis.example:6379/1"
  CELERY_RESULT_BACKEND: "redis://:REPLACE_WITH_STRONG_PASSWORD@redis.example:6379/2"
  SECRET_KEY: "REPLACE_WITH_32_CHARS_MIN_SECRET_KEY_FOR_JWT"
  OPENAI_API_KEY: "REPLACE_IF_USED"
  ANTHROPIC_API_KEY: "REPLACE_IF_USED"
  TAVILY_API_KEY: "REPLACE_IF_USED"
